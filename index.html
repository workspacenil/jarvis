<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS | CORE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="universe">
        <!-- Header -->
        <div class="top-bar">
            <div class="left">JARVIS <span class="separator">•</span> MARK 5 <span class="tag">GRATIS</span></div>
            <div class="right">MISSION CONTROL <span class="arrow">▶</span></div>
        </div>

        <!-- Evidence Panel -->
        <div class="evidence-panel">
            <div class="panel-title">TABLERO DE EVIDENCIAS</div>
            <div class="panel-content">Aquí aparecen las evidencias recopiladas...</div>
        </div>

        <!-- The Energy Core -->
        <div class="core-wrapper" id="core-wrapper">
            <div class="plasma-sphere">
                <div class="layer layer-1"></div>
                <div class="layer layer-2"></div>
                <div class="layer layer-3"></div>
                <div class="center-light"></div>
            </div>
            <div class="core-label" id="core-label">JARVIS <span class="dot">•</span> CALMADO</div>
        </div>

        <!-- Actions Menu -->
        <div class="actions">
            <div class="action"><div class="icon-box">🔍</div><span>BUSCAR</span></div>
            <div class="action"><div class="icon-box">⚙️</div><span>SIST.</span></div>
            <div class="action"><div class="icon-box">🎵</div><span>MEDIA</span></div>
            <div class="action"><div class="icon-box">✨</div><span>CREAR</span></div>
            <div class="action"><div class="icon-box">👁️</div><span>VER</span></div>
            <div class="action"><div class="icon-box">🛠️</div><span>MODELS</span></div>
        </div>

        <!-- Input Section -->
        <div class="interaction-zone">
            <div class="mic-container" id="mic-btn">
                <div class="mic-circle">
                    <span class="mic-icon">🎤</span>
                </div>
            </div>
            <div class="text-bar">
                <input type="text" id="user-input" placeholder="escribe aquí, señor...">
                <button id="send-btn">ENVIAR</button>
            </div>
            <div class="hint">PULSE PARA HABLAR</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="cam-status">📷 CÁMARA <span id="cam-off">APAGADA</span></div>
            <div class="system-led" id="led-status">
                <div class="led"></div>
                <span>SISTEMA OFFLINE</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
