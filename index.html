<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS - Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <!-- Background image from the user's download -->
        <div class="hud-bg"></div>

        <div class="overlay"></div>

        <!-- Central Core -->
        <div class="core-container">
            <div class="core-ring ring-1"></div>
            <div class="core-ring ring-2"></div>
            <div class="core-ring ring-3"></div>
            <div class="core-center" id="jarvis-core">
                <div class="pulse"></div>
            </div>
            <div class="status-text" id="status">SISTEMA: EN ESPERA</div>
        </div>

        <!-- Side Panels - PC Only (hidden on mobile) -->
        <div class="side-panel left-panel pc-only">
            <div class="panel-box">
                <h3>BIOMETRICS</h3>
                <div class="data-line"><span class="label">HEART RATE:</span> <span class="value">72 BPM</span></div>
                <div class="data-line"><span class="label">OXY LEVEL:</span> <span class="value">98%</span></div>
                <div class="data-line"><span class="label">STRESS:</span> <span class="value">LOW</span></div>
            </div>
            <div class="panel-box">
                <h3>SYSTEM LOGS</h3>
                <div class="log-item">> Initializing...</div>
                <div class="log-item">> Core Stable</div>
                <div class="log-item">> Awaiting Input</div>
            </div>
        </div>

        <div class="side-panel right-panel pc-only">
            <div class="panel-box">
                <h3>ENVIRONMENT</h3>
                <div class="data-line"><span class="label">TEMP:</span> <span class="value">22°C</span></div>
                <div class="data-line"><span class="label">HUMIDITY:</span> <span class="value">45%</span></div>
            </div>
            <div class="panel-box">
                <h3>ENERGY</h3>
                <div class="energy-bar"><div class="fill"></div></div>
                <div class="value-text">89% CAPACITY</div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="controls">
            <button id="call-btn" class="btn-main">INICIAR LLAMADA</button>
            <div class="voice-indicator">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
<!-- Force Deploy -->
